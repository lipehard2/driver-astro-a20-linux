PACKAGE_NAME="astro-a20"
PACKAGE_VERSION="0.1.1"

BUILT_MODULE_NAME[0]="astro_a20"
BUILT_MODULE_LOCATION[0]="src/"
DEST_MODULE_LOCATION[0]="/kernel/drivers/usb/misc"

# the Makefile picks LLVM=1 for kernels built with clang
MAKE[0]="make KVER=${kernelver} module"
CLEAN="make KVER=${kernelver} module-clean"

AUTOINSTALL="yes"
